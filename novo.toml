[package]
name        = "geometry-nv"
version     = "0.1.0"
description = "Two-dimensional geometry as unboxed arithmetic: points, vectors and sizes in a Float and an Int flavour, rectangles with the union/intersection/containment algebra, 2x3 affine transforms, polygons with area, winding and containment, and a shelf packer for fitting rectangles into a bin."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet, and the tests were written against the signatures rather
# than by a consumer.
stability   = "experimental"

# `core`: every function is arithmetic over numbers the caller already
# holds.  Nothing is read, nothing is written and no clock is consulted.
#
# `tests/embedded_probe.nv` builds `geompoint`, `geomrect` and
# `geomxform` for a Cortex-M4 and checks four answers on it under QEMU.
# `tests/alloc_scan.sh` reads the emitted LLVM of the same three modules
# and finds no call to the allocator.  The other four modules allocate
# or call the C maths library.
layer       = "core"

category    = "graphics"

tags        = ["geometry", "point", "rect", "affine", "transform", "polygon", "packing", "euclid", "shapely"]
repository  = "https://github.com/novolang/geometry-nv"
maintainers = ["novo-lang"]
# 0.12.0 is the first toolchain with list slicing, which `geompoly` and
# `geompack` copy their lists with.
novo        = ">= 0.12.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "Points, rectangles, transforms and the packing arithmetic"

[dependencies]
# None.  The package needs the standard library's arithmetic and
# nothing else, and svg-nv, font-nv and raster-nv are built on it.
